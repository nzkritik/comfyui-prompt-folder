[project]
name = "comfyui-prompt-folder"
description = "Load prompts from a folder of .txt files in ComfyUI, at random or in sequence, and see which one was picked."
version = "0.2.2"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/nzkritik/comfyui-prompt-folder"
Documentation = "https://github.com/nzkritik/comfyui-prompt-folder#readme"
"Bug Tracker" = "https://github.com/nzkritik/comfyui-prompt-folder/issues"

[tool.comfy]
PublisherId = "nzkritik"
DisplayName = "Prompt Folder"
Icon = "https://raw.githubusercontent.com/nzkritik/comfyui-prompt-folder/main/icon.png"
# V3 node API: custom-node comfy_entrypoint arrived in 0.3.48.
requires-comfyui = ">=0.3.48"
